<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT SW1 & Drill2</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" /> 
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>

<style>
body{
    background-color:rgb(50, 119, 255);
    }

#content{
    width: 400px;
    height: 350px;
    background-color: white;
    color:rgb(33, 33, 121);
    margin: 100px auto 100px auto;
    padding: 47px 73px;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    font-size: larger;
}

#calculator{
    width: 400px;
    height: 250px;
    background-color: white;
    color:rgb(33, 33, 121);
    margin: 60px auto 100px auto;
    padding: 47px 73px;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    font-size: larger;
}

.button{
    padding: 7px 7px;
    font-size: 16px;
    font-weight: 400;
    font-family: sans-serif;
    text-align: center;

}
</style>


<body>
    <py-script type="py" src="main.py"></py-script> 

    <div id="content"><h3>All About Jacque</h3>
    </div>
    
    </div>


    <div id="calculator">
    <h3>Calculator</h3>
    <center>
        <input type="number" id="value1">
        <input type="number" id="value2">

        <br><br><br>
        
            <button class="button" type="submit" py-click="add">Add</button>
            <button class="button" type="submit" py-click="subtract">Subtract</button>
            <button class="button" type="submit" py-click="multiply">Multiply</button>
            <button class="button"  type="submit" py-click="divide">Divide</button>
            <p id="output"></p>
    </center>
                

    </div>
